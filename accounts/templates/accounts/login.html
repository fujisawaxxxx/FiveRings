<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 400px;
        }
        .login-title {
            color: #0dcaf0;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .admin-button {
            background-color: #0dcaf0;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 15px;
            font-weight: bold;
            display: inline-block;
        }
        .admin-button:hover {
            background-color: #0bacce;
            color: white;
        }
        /* フォームフィールドのスタイル */
        form p {
            margin-bottom: 1rem;
        }
        form p label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        form p input {
            width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            color: #212529;
            background-color: #fff;
            background-clip: padding-box;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        form p input:focus {
            color: #212529;
            background-color: #fff;
            border-color: #0dcaf0;
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(13, 202, 240, 0.25);
        }
        .btn-info {
            background-color: #0dcaf0;
            border-color: #0dcaf0;
            color: white;
            font-weight: 500;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            width: 100%;
        }
        .btn-info:hover {
            background-color: #0bacce;
            border-color: #0bacce;
        }
        .text-center {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 class="login-title">ログイン</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-info">ログイン</button>
        </form>
        <!-- <div class="text-center mt-3">
            <p>アカウントをお持ちでない方は <a href="{% url 'add_account' %}" style="color: #0dcaf0;">新規登録</a></p>
        </div> -->
    </div>

    <!-- Bootstrap JS (オプション) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
