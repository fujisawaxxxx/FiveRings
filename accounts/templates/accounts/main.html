        // 数値をカンマ区切りにするヘルパー関数
        function numberWithCommas(x) {
            return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // 見積もり計算ボタンの動作
        function calculateEstimate() {
            var quantity = parseFloat(document.getElementById("quantity").value) || 0;
            var selectedProduct = document.getElementById("document-type").value;
            
            console.log("Selected Product:", selectedProduct);
            console.log("Quantity:", quantity);

            // 汎用商品の場合
            if (selectedProduct === "generic") {
                var unitPrice = document.getElementById("unit-price").value;
                
                // 単価が入力されているか確認
                if (!unitPrice) {
                    document.getElementById("estimate-result").innerText = "単価が未入力です。";
                    return;
                }
                
                // 単価と数量から合計金額を計算
                var totalPrice = unitPrice * quantity;
                
                // 結果を表示（カンマ区切り）
                document.getElementById("estimate-result").innerText = "見積もり金額: " + numberWithCommas(totalPrice) + "円";
                document.getElementById("estimate-tnk").innerText = "単価: " + numberWithCommas(unitPrice) + "円";
                
                // 注文書作成ボタンを表示
                document.getElementById("order-create-button").style.display = "block";
                return;
            }

            var content = parseFloat(document.getElementById("content").value) || 0;
            if (quantity === 0 || (selectedProduct !== "participation-card" && content === 0)) {
                document.getElementById("estimate-result").innerText = "数量または本文が未入力です。";
                document.getElementById("estimate-tnk").innerText = "";
                document.getElementById("discount-message").innerText = "";
                document.getElementById("total-pages-result").innerText = "総頁数: -";
                return;
            }

            let apiUrl;

            // 参加カードの場合
            if (selectedProduct === "participation-card") {
                console.log("Processing participation-card");
                // 参加カードの種類を取得
                const cardType = document.getElementById("sanka-card-type").value;
                console.log("Card Type:", cardType);
                if (!cardType) {
                    document.getElementById("estimate-result").innerText = "参加カードの種類を選択してください。";
                    document.getElementById("estimate-tnk").innerText = "";
                    return;
                }
                // APIリクエストのURLを設定
                apiUrl = `/items/api/participation-card/?card_type=${encodeURIComponent(cardType)}`;
                console.log("API URL:", apiUrl);
            } 
            // 他の商品の場合
            else {
                // 同意説明書の場合の総頁数計算
                if (selectedProduct === "consent-color" || selectedProduct === "consent-monochrome") {
                    // 複写オプションの頁数を取得
                    var fukusha1Pages = parseInt(document.getElementById("fukusha1-label").innerText) || 0;
                    var fukusha2Pages = parseInt(document.getElementById("fukusha2-label").innerText) || 0;
                    var fukusha3Pages = parseInt(document.getElementById("fukusha3-label").innerText) || 0;
                    var fukusha4Pages = parseInt(document.getElementById("fukusha4-label").innerText) || 0;
                    var atsugami2Pages = parseInt(document.getElementById("atsugami2-label").innerText) || 0;
                    var atsugami3Pages = parseInt(document.getElementById("atsugami3-label").innerText) || 0;

                    // 総頁数を計算
                    var totalPages = content + fukusha1Pages + fukusha2Pages + fukusha3Pages + 
                                   fukusha4Pages + atsugami2Pages + atsugami3Pages;
                    
                    // 総頁数を表示
                    document.getElementById("total-pages-result").innerText = "総頁数: " + totalPages;
                }

                // 商品別に異なるAPIエンドポイントを設定
                if (selectedProduct === "consent-color") {
                    apiUrl = `/items/api/agree-color/?content=${totalPages}`;  // contentをtotalPagesに変更
                } else if (selectedProduct === "consent-monochrome") {
                    apiUrl = `/items/api/agree-monochrome/?content=${totalPages}`;  // contentをtotalPagesに変更
                } else if (selectedProduct === "case-card") {
                    apiUrl = `/items/api/casecard-price/?content=${content}`;
                } else if (selectedProduct === "chiken-plan") {
                    apiUrl = `/items/api/chiken-plan-price/?content=${content}`;
                } else if (selectedProduct === "medication-diary") {
                    apiUrl = `/items/api/medication-diary-price/?content=${content}`;
                }
            }

            // 追加料金を取得
            var copyOptionValue = document.getElementById("fukusha5").value;
            var additionalCharge = 0;
            switch (copyOptionValue) {
                case "fukusha_add_price-1":
                    additionalCharge = 60;
                    break;
                case "fukusha_add_price-2":
                    additionalCharge = 40;
                    break;
                case "fukusha_add_price-3":
                    additionalCharge = 50;
                    break;
                case "fukusha_add_price-4":
                    additionalCharge = 30;
                    break;
                default:
                    additionalCharge = 0;
            }

            // APIリクエストの実行
            if (apiUrl) {
                fetch(apiUrl)
                    .then(response => response.json())
                    .then(data => {
                        if (data.unit_price) {
                            var unitPrice = parseFloat(data.unit_price);

                            // すべて複写なしのとき50円引き
                            var isNoCopyOption = (
                                document.getElementById("fukusha1").value === "fukusha1-0" &&
                                document.getElementById("fukusha2").value === "fukusha2-0" &&
                                document.getElementById("fukusha3").value === "fukusha3-0"
                            );

                            if (isNoCopyOption) {
                                unitPrice -= 50;
                                document.getElementById("discount-message").innerText = "すべて複写なし：50円引き";
                            } else {
                                document.getElementById("discount-message").innerText = ""; // メッセージをクリア
                            }

                            // 2穴不要のチェックがONの場合、単価を10円減らす
                            if (selectedProduct === "case-card" && document.getElementById("no-holes").checked) {
                                unitPrice -= 10;
                                document.getElementById("discount-message").innerText += " 2穴不要：10円引き";
                            }

                            // 追加料金を単価に加算
                            unitPrice += additionalCharge;

                            // 見積もり金額の計算
                            var totalPrice = quantity * unitPrice;
                            document.getElementById("estimate-result").innerText = "見積もり金額: " + numberWithCommas(totalPrice) + "円";
                            document.getElementById("estimate-tnk").innerText = "単価: " + numberWithCommas(unitPrice) + "円";
                        } else {
                            document.getElementById("estimate-result").innerHTML = "該当する頁数が見つかりません。<br>" + 
                                                                    "<span style='color: red;'>メールにて頁数を担当までご連絡ください。</span>";
                            document.getElementById("estimate-tnk").innerText = "";
                        }
                    })
                    .catch(error => {
                        console.error("Fetch Error:", error);
                        document.getElementById("estimate-result").innerText = "エラーが発生しました。";
                    });
            }

            // 成功時に注文書作成ボタンを表示
            var orderButton = document.getElementById("order-create-button");
            if (orderButton) {
                orderButton.style.display = "block";
            }
        }


        function order_create() {
            // ファイルがアップロードされているかチェック
            const uploadFileName = document.getElementById("selected-filename").innerText || "-";
            if (uploadFileName === "" || uploadFileName === "-") {
                alert("入稿ファイルを選択してください。");
                return; // 処理を中断
            }

            // 基本データを取得
            const productType = document.getElementById("document-type").value;
            const quantity = document.getElementById("quantity").value || "-";
            const content = document.getElementById("content").value || "-";
            
            // カンマを削除して数値のみを取得
            const unitPrice = document.getElementById("estimate-tnk").innerText
                .replace("単価: ", "")
                .replace("円", "")
                .replace(/,/g, "") || "-";
            
            const estimateResult = document.getElementById("estimate-result").innerText
                .replace("見積もり金額: ", "")
                .replace("円", "")
                .replace(/,/g, "") || "-";

            // 複写オプションの日本語表記への変換
            function getFukusha1Text(value) {
                const options = {
                    'fukusha1-0': '複写なし',
                    'fukusha1-1': '2枚4頁',
                    'fukusha1-2': '3枚6頁（基本）',
                    'fukusha1-3': '4枚8頁',
                    'fukusha1-4': '5枚10頁'
                };
                return options[value] || value;
            }

            function getFukusha2Text(value) {
                const options = {
                    'fukusha2-0': '複写なし',
                    'fukusha2-1': '2枚4頁',
                    'fukusha2-2': '3枚6頁',
                    'fukusha2-3': '4枚8頁',
                    'fukusha2-4': '5枚10頁'
                };
                return options[value] || value;
            }

            function getFukusha3Text(value) {
                const options = {
                    'fukusha3-0': '複写なし',
                    'fukusha3-1': '2枚4頁',
                    'fukusha3-2': '3枚6頁',
                    'fukusha3-3': '4枚8頁',
                    'fukusha3-4': '5枚10頁'
                };
                return options[value] || value;
            }

            function getFukusha4Text(value) {
                const options = {
                    'fukusha_no-0': 'なし',
                    'fukusha_no-1': '1枚2頁',
                    'fukusha_no-2': '2枚4頁',
                    'fukusha_no-3': '3枚6頁'
                };
                return options[value] || value;
            }

            function getFukusha5Text(value) {
                const options = {
                    'fukusha_add_price-0': 'オプションなし',
                    'fukusha_add_price-1': 'カラー3枚複写',
                    'fukusha_add_price-2': 'カラー2枚複写',
                    'fukusha_add_price-3': '両面3枚複写',
                    'fukusha_add_price-4': '両面2枚複写'
                };
                return options[value] || value;
            }

            // 追加データを取得（複写オプションは日本語表記に変換）
            const facility = document.getElementById("facility").value || "-";
            const invoiceDetail = document.getElementById("invoice-detail").value || "-";
            const sankaCardType = document.getElementById("sanka-card-type").value || "-";
            const fukusha1 = getFukusha1Text(document.getElementById("fukusha1").value) || "-";
            const fukusha2 = getFukusha2Text(document.getElementById("fukusha2").value) || "-";
            const fukusha3 = getFukusha3Text(document.getElementById("fukusha3").value) || "-";
            const fukusha4 = getFukusha4Text(document.getElementById("fukusha4").value) || "-";
            const fukusha5 = getFukusha5Text(document.getElementById("fukusha5").value) || "-";
            const totalPages = document.getElementById("total-pages-result").innerText.replace("総頁数: ", "") || "-";
            const additionalPrint = document.getElementById("additional-print").checked;
            const remarks = document.getElementById("remarks").value || "-";

            // 2穴不要の状態を取得
            const noHoles = document.getElementById("no-holes")?.checked || false;

            // アップロードファイル関連の情報を取得
            const uploadFileTimestamped = document.getElementById("upload-file-timestamped").value || "-";

            // プロジェクト名を取得
            const projectName = document.getElementById("project").value || "-";

            // URLにデータを渡して遷移
            const url = `{% url 'create_order' %}?` + 
                `product_type=${encodeURIComponent(productType)}` +
                `&quantity=${encodeURIComponent(quantity)}` +
                `&content=${encodeURIComponent(content)}` +
                `&unit_price=${encodeURIComponent(unitPrice)}` +
                `&estimate_result=${encodeURIComponent(estimateResult)}` +
                `&invoice_detail=${encodeURIComponent(invoiceDetail)}` +
                `&facility=${encodeURIComponent(facility)}` +
                `&upload_file=${encodeURIComponent(uploadFileName)}` +
                `&upload_file_timestamped=${encodeURIComponent(uploadFileTimestamped)}` +
                `&sanka_card_type=${encodeURIComponent(sankaCardType)}` +
                `&fukusha1=${encodeURIComponent(fukusha1)}` +
                `&fukusha2=${encodeURIComponent(fukusha2)}` +
                `&fukusha3=${encodeURIComponent(fukusha3)}` +
                `&fukusha4=${encodeURIComponent(fukusha4)}` +
                `&fukusha5=${encodeURIComponent(fukusha5)}` +
                `&total_pages=${encodeURIComponent(totalPages)}` +
                `&additional_print=${encodeURIComponent(additionalPrint)}` +
                `&no_holes=${encodeURIComponent(noHoles)}` +
                `&project_name=${encodeURIComponent(projectName)}` +
                `&remarks=${encodeURIComponent(remarks)}`;

            window.location.href = url;
        }


        window.onload = toggleCopyOptions;

        // レスポンスヘッダーから成功メッセージを取得して表示
        document.addEventListener('DOMContentLoaded', function() {
            const orderSuccess = "{{ request.META.HTTP_X_ORDER_SUCCESS|escapejs }}";
            if (orderSuccess) {
                alert(orderSuccess);
            }
            
            // 流用ボタンのクリックイベントを設定
            const reuseButton = document.getElementById('reuse-button');
            if (reuseButton) {
                reuseButton.addEventListener('click', function() {
                    const orderNumber = document.getElementById('reuse-code').value.trim();
                    if (!orderNumber) {
                        alert('流用コードを入力してください');
                        return;
                    }
                    
                    // 流用コードを使って注文データを取得
                    fetch(`/accounts/get_order_data/${orderNumber}/`)
                        .then(response => response.json())
                        .then(result => {
                            if (result.success) {
                                // 詳細請求書名を設定
                                document.getElementById('invoice-detail').value = result.data.invoice_detail || '';
                                // 施設名を設定
                                document.getElementById('facility').value = result.data.facility || '';
                            } else {
                                alert(result.error || '注文データの取得に失敗しました');
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            alert('注文データの取得中にエラーが発生しました');
                        });
                });
            }
        });

        const element = document.getElementById('upload-file');
        if (element) {
            element.addEventListener('change', async function(e) {
                if (!e.target.files.length) return;
                
                const file = e.target.files[0];
                // ファイルサイズチェック (20MB = 20 * 1024 * 1024 bytes)
                if (file.size > 20 * 1024 * 1024) {
                    alert('ファイルサイズが大きすぎます。20MB以下のファイルを選択してください。');
                    // 選択をクリア
                    e.target.value = '';
                    document.getElementById('selected-filename').textContent = '';
                    document.getElementById('upload-status').textContent = '';
                    return;
                }
                
                // アップロード中の表示
                document.getElementById('upload-status').textContent = 'アップロード中...';
                
                const formData = new FormData();
                formData.append('file', file);
                
                try {
                    const response = await fetch('{% url "upload_file" %}', {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-CSRFToken': '{{ csrf_token }}'
                        }
                    });
                    
                    const data = await response.json();
                    if (data.success) {
                        // オリジナルのファイル名を表示
                        document.getElementById('selected-filename').textContent = data.original_filename;
                        // タイムスタンプ付きのファイル名を隠しフィールドに保存
                        document.getElementById('upload-file-timestamped').value = data.timestamped_filename;
                        document.getElementById('upload-status').textContent = 'アップロード完了';
                    } else {
                        alert('ファイルのアップロードに失敗しました。');
                        document.getElementById('upload-status').textContent = 'アップロード失敗';
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('ファイルのアップロードに失敗しました。');
                    document.getElementById('upload-status').textContent = 'アップロード失敗';
                }
            });
        }

        // 商品説明を更新する関数（新規追加）
        function updateProductDescription(productType) {
            var descriptionElement = document.getElementById("product-description");
            var description = "";
            
            switch(productType) {
                case "consent-color":
                case "consent-monochrome":
                    description = "【複写頁をカラー印刷：3枚複写1セット毎→70円増　2枚複写1セット毎→45円増】<br>" +
                                "【複写頁を両面印刷：3枚複写1セット毎→55円増　2枚複写1セット毎→35円増】<br>" +
                                "【複写頁がなしの場合：50円減】<br>" + 
                                "共通仕様：A4　 無線綴じ(くるみ製本)　ミシン線加工あり<br>" + 
                                "表紙・上質70.5kg　本文・上質44.5kg　複写用紙#50　厚紙・上質70.5kg　同意撤回書・上質44.5kg　　<br>" + 
                                "※基本セットして複写頁3枚(=6頁)が1セット付属いたします(全体頁数には加算されません)<br>" + 
                                "※複写頁が基本セットより増減する場合は、それに併せて全体頁数も増減します(1枚=2頁)<br>" +
                                "※厚紙(仕切り紙)・同意撤回書を付属する場合は、それに併せて全体頁数も増加します(1枚=2頁)";
                    break;
                case "case-card":
                    description = "仕様：A4　両面モノクロ<br>上質110kg<br>中綴じ・2穴加工あり<br>2穴不要の場合は10円減<br>※90頁を越える場合は要相談";
                    break;
                case "chiken-plan":
                    description = "仕様：A4　両面モノクロ<br>表紙・上質110kg<br>本文・上質70kg<br>無線綴じ(くるみ製本)";
                    break;
                case "medication-diary":
                    description = "仕様：A5　両面カラー<br>上質110kg<br>中綴じ";
                    break;
                case "participation-card":
                    description = "仕様:仕上55mm × 91mm 両面カラー<br>コート紙90kg";
                    break;
                case "generic":
                    description = "<span style='color: red;'>数量と単価以外の詳細は全て備考に記入してください</span>";
                    break;
                default:
                    description = "";
            }
            
            descriptionElement.innerHTML = description;
        }
        
        // DOMが読み込まれたら初期化処理を実行
        document.addEventListener('DOMContentLoaded', function() {
            console.log("DOM loaded, initializing...");
            // 初期表示時に商品説明を更新
            var selectedProduct = document.getElementById("document-type").value;
            updateProductDescription(selectedProduct);
            
            // 初期表示時に本文フィールドの表示/非表示を設定
            var contentField = document.getElementById("content-field");
            if (contentField) {
                if (selectedProduct === "participation-card" || selectedProduct === "generic") {
                    contentField.classList.add("d-none");
                    contentField.classList.remove("d-flex");
                } else {
                    contentField.classList.remove("d-none");
                    contentField.classList.add("d-flex");
                }
            }
            
            // 初期表示時に複写オプションの表示/非表示を設定
            toggleCopyOptions();
        });

        // ファイル選択時の処理
        function handleFileSelect() {
            const fileInput = document.getElementById('upload-file');
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                document.getElementById('selected-filename').textContent = file.name;
                document.getElementById('upload-status').textContent = 'アップロード中...';
                
                // ファイルをアップロード
                uploadFile(file);
            }
        }

        // ファイルアップロード処理
        async function uploadFile(file) {
            try {
                const formData = new FormData();
                formData.append('file', file);
                
                const response = await fetch('/accounts/upload/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}'
                    }
                });
                
                const data = await response.json();
                if (data.success) {
                    // オリジナルのファイル名を表示
                    document.getElementById('selected-filename').textContent = data.original_filename;
                    // タイムスタンプ付きのファイル名を隠しフィールドに保存
                    document.getElementById('upload-file-timestamped').value = data.timestamped_filename;
                    document.getElementById('upload-status').textContent = 'アップロード完了';
                } else {
                    alert('ファイルのアップロードに失敗しました。');
                    document.getElementById('upload-status').textContent = 'アップロード失敗';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('ファイルのアップロードに失敗しました。');
                document.getElementById('upload-status').textContent = 'アップロード失敗';
            }
        }
    </script>
</head>
<body class="container py-3">
    <!-- タイトル部分を装飾 -->
    <div class="mb-4 d-flex justify-content-between align-items-center">
        <h3 class="text-info fw-bold border-bottom border-info pb-2">見積もり作成</h3>
        <div class="d-flex align-items-center">
            <!-- 流用機能 -->
            <div class="me-3 d-flex align-items-center">
                <input type="text" id="reuse-code" name="reuse_code" class="form-control form-control-sm me-2" style="width: 150px; border-color: #0dcaf0;" placeholder="流用コード">
                <button type="button" id="reuse-button" class="btn btn-info btn-sm">流用</button>
            </div>
            <!-- 既存の管理画面ボタン -->
            <a href="/admin/" class="btn btn-secondary btn-sm" target="_blank">管理画面</a>
        </div>
    </div>
    
    <!-- 詳細請求書名と入稿ファイルを1行に配置 -->
    <div class="row mb-3">
        <div class="col-md-12">
            <div class="d-flex align-items-center flex-wrap">
                <!-- 詳細請求書名 -->
                <div class="me-4 d-flex align-items-center">
                    <label for="invoice-detail" class="form-label mb-0 me-2">詳細請求書名：</label>
                    <input type="text" id="invoice-detail" name="invoice_detail" class="form-control" style="width: 300px; border-color: #0dcaf0;">
                </div>


                
                <!-- 入稿ファイル -->
                <div class="d-flex align-items-center">
                    <label for="upload-file" class="form-label mb-0 me-2">入稿ファイル：</label>
                    <input type="file" id="upload-file" name="file" accept="*/*" style="display: none;" onchange="handleFileSelect()">
                    <button type="button" onclick="document.getElementById('upload-file').click()" class="btn btn-info me-2">ファイルを選択</button>
                    <span id="selected-filename"></span>
                    <span id="upload-status" class="text-success ms-2"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- 施設名とプロジェクト名を横並びに -->
    <div class="d-flex align-items-center mb-3">
        <!-- 施設名 -->
        <div class="me-4 d-flex align-items-center">
            <label for="facility" class="form-label mb-0 me-2">施設名：</label>
            <input type="text" id="facility" name="facility" class="form-control" style="width: 300px; border-color: #0dcaf0;">
        </div>
        
        <!-- プロジェクト名 -->
        <div class="d-flex align-items-center">
            <label for="project" class="form-label mb-0 me-2">プロジェクト名：</label>
            <select id="project" name="project" class="form-select" style="width: 300px; border-color: #0dcaf0;">
                <option value="">選択してください</option>
                {% for project in projects %}
                    <option value="{{ project }}">{{ project }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <!-- タイムスタンプ付きファイル名を保存する隠しフィールド -->
    <input type="hidden" id="upload-file-timestamped" name="upload_file_timestamped">

    <!-- 商品選択と商品説明を縦に配置 -->
    <div class="mb-3">
        <!-- 商品選択部分 -->
        <div class="d-flex align-items-center mb-2">
            <label for="document-type" class="form-label mb-0 me-2">商品を選択:</label>
            <select id="document-type" name="document_type" onchange="toggleCopyOptions()" class="form-select" style="width: 300px; border-color: #0dcaf0;">
                <option value="consent-color">同意説明書（カラー）</option>
                <option value="consent-monochrome">同意説明書（モノクロ）</option>
                <option value="case-card">ケースカード（症例報告書）</option>
                <option value="chiken-plan">治験実施計画書</option>
                <option value="medication-diary">服薬日誌</option>
                <option value="participation-card">参加カード</option>
                <option value="generic">汎用</option>
            </select>
        </div>
        
        <!-- 商品説明部分 -->
        <div id="product-description" class="product-description-box"></div>
    </div>

    <!-- 数量と本文を1行に配置 -->
    <div class="row mb-3">
        <div class="col-md-12">
            <div class="d-flex align-items-center">
                <!-- 数量フィールド -->
                <div class="me-4 d-flex align-items-center">
                    <label for="quantity" class="form-label mb-0 me-2">数量:</label>
                    <input type="number" id="quantity" name="quantity" min="1" required class="form-control" style="width: 100px; border-color: #0dcaf0;">
                    <span class="ms-2">部</span>
                </div>
                
                <!-- 本文フィールド - d-noneクラスを追加して初期状態を制御 -->
                <div id="content-field" class="d-flex align-items-center">
                    <label for="content" class="form-label mb-0 me-2">本文:</label>
                    <input type="number" id="content" name="content" min="2" step="2" required class="form-control" style="width: 100px; border-color: #0dcaf0;">
                    <span class="ms-2">頁</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 2穴不要のチェックボックス -->
    <div id="no-holes-option" style="display: none;" class="mb-3">
        <div class="form-check">
            <input type="checkbox" id="no-holes" name="no_holes" class="form-check-input">
            <label for="no-holes" class="form-check-label">2穴不要</label>
        </div>
    </div>

    <!-- 単価フィールド（初期状態では非表示） -->
    <div id="unit-price-field" style="display: none;" class="mb-3">
        <label for="unit-price" class="form-label">単価:</label>
        <div class="input-group" style="width: 150px;">
            <input type="number" id="unit-price" name="unit_price" min="1" required class="form-control" style="border-color: #0dcaf0;">
            <span class="input-group-text">円</span>
        </div>
    </div>

    <!-- 参加カード種類フィールド -->
    <div id="card-type-field" style="display: none;" class="mb-3">
        <label for="sanka-card-type" class="form-label">参加カードの種類:</label>
        <select id="sanka-card-type" name="sanka_card_type" class="form-select" style="width: 300px; border-color: #0dcaf0;">
            <option value="">選択してください</option>
            {% for card_type in participation_cards %}
                <option value="{{ card_type }}">{{ card_type }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- 複写オプション -->
    <div id="copy-options" style="display: none;" class="mb-4">
        <table class="copy-options-table">
            <tr>
                <!-- テーブルのヘッダー -->
                <th>複写</th>
                <th>選択</th>
                <th>複写頁数</th>
                <th>厚紙頁数</th>
            </tr>
            <tr>
                <!-- テーブル1行目 -->
                <!-- 1行目1列目 -->
                <td>複写1:</td>

                <!-- 1行目2列目 -->
                <td>
                    <select id="fukusha1" name="fukusha1" onchange="toggleCopyOptionsfukusha1()">
                        <option value="fukusha1-2">3枚6頁（基本）</option>
                        <option value="fukusha1-0">複写なし</option>
                        <option value="fukusha1-1">2枚4頁</option>
                        <option value="fukusha1-3">4枚8頁</option>
                        <option value="fukusha1-4">5枚10頁</option>
                    </select>
                    <!-- デフォルトで最初の選択肢（3枚6頁（基本））が表示されます。
                     この要素は「複写1」に関連し、選択が変更されると onchange 属性で指定された
                     関数 toggleCopyOptionsfukusha1 が呼び出される -->
                </td>

                <!-- 1行目3列目 -->
                <td><span id="fukusha1-label">-</span></td>
                <!-- 初期状態は「-」 -->

                <!-- 1行目4列目 -->
                <td></td>
            </tr>
            <tr>
                <!-- テーブル2行目 -->
                <!-- 2行目1列目 -->
                <td>複写2:</td>

                <!-- 2行目2列目 -->
                <td>
                    <select id="fukusha2" name="fukusha2" onchange="toggleCopyOptionsfukusha2()">
                        <option value="fukusha2-0">複写なし</option>
                        <option value="fukusha2-1">2枚4頁</option>
                        <option value="fukusha2-2">3枚6頁</option>
                        <option value="fukusha2-3">4枚8頁</option>
                        <option value="fukusha2-4">5枚10頁</option>
                    </select>
                </td>

                <!-- 2行目3列目 -->
                <td><span id="fukusha2-label">-</span></td>

                <!-- 2行目4列目 -->
                <td><span id="atsugami2-label">-</span></td>
            </tr>
            <tr>
                <!-- テーブル3行目 -->
                <!-- 3行目1列目 -->
                <td>複写3:</td>
                <!-- 3行目2列目 -->
                <td>
                    <select id="fukusha3" name="fukusha3" onchange="toggleCopyOptionsfukusha3()">
                        <option value="fukusha3-0">複写なし</option>
                        <option value="fukusha3-1">2枚4頁</option>
                        <option value="fukusha3-2">3枚6頁</option>
                        <option value="fukusha3-3">4枚8頁</option>
                        <option value="fukusha3-4">5枚10頁</option>
                    </select>
                </td>
                <!-- 3行目3列目 -->
                <td><span id="fukusha3-label">-</span></td>
                <!-- 3行目4列目 -->
                <td><span id="atsugami3-label">-</span></td>
            </tr>
            <tr>
                <!-- テーブル4行目 -->
                <!-- 4行目1列目 -->
                <td>複写なしミシン目:</td>
                <!-- 4行目2列目 -->
                <td>
                    <select id="fukusha4" name="fukusha4" onchange="toggleCopyOptionsfukusha4()">
                        <option value="fukusha_no-0">なし</option>
                        <option value="fukusha_no-1">1枚2頁</option>
                        <option value="fukusha_no-2">2枚4頁</option>
                        <option value="fukusha_no-3">3枚6頁</option>
                    </select>
                </td>
                <!-- 4行目3列目 -->
                <td><span id="fukusha4-label">-</span></td>
                <!-- 4行目4列目 -->
                <td></td>
            </tr>
        </table>
        <br>
        <label for="fukusha5">複写オプション:</label>
        <select id="fukusha5" name="fukusha5" onchange="displayAdditionalCharge()">
            <option value="fukusha_add_price-0">オプションなし</option>
            <option value="fukusha_add_price-1">カラー3枚複写</option>
            <option value="fukusha_add_price-2">カラー2枚複写</option>
            <option value="fukusha_add_price-3">両面3枚複写</option>
            <option value="fukusha_add_price-4">両面2枚複写</option>
        </select>
        <span id="additional-charge-label">追加料金: - 円</span>

        <p id="discount-message"></p>
    </div>

    <!-- 見積もり計算ボタンと見積もり結果を横並びに表示 -->
    <div class="d-flex align-items-center mb-3">
        <!-- 見積もり計算ボタン -->
        <button type="button" onclick="calculateEstimate()" class="btn btn-info me-3">見積もり計算</button>
        
        <!-- 見積もり結果 -->
        <p id="estimate-result" class="mb-0 me-4">見積もり金額: - 円</p>
        <p id="estimate-tnk" class="mb-0 me-4">単価: - 円</p>
        <p id="total-pages-result" class="mb-0">総頁数: -</p>
    </div>

    <!-- 追加（増刷）のチェックボックス -->
    <div class="form-check mb-3">
        <input type="checkbox" id="additional-print" name="additional_print" class="form-check-input">
        <label for="additional-print" class="form-check-label">追加（増刷）</label>
    </div>

    <!-- 備考の入力フィールド -->
    <div class="form-group mb-4">
        <label for="remarks" class="form-label">備考：</label>
        <textarea id="remarks" name="remarks" class="form-control" style="width: 400px; height: 100px; border-color: #0dcaf0;"></textarea>
    </div>

    <!-- 注文書作成ボタン（初期状態では非表示） -->
    <button type="button" id="order-create-button" onclick="order_create()" style="display: none;" class="btn btn-info mb-3">注文書作成</button>
    
    <!-- ログアウトボタンとクリアボタン -->
    <div class="mb-3">
        <button type="button" onclick="window.location.href='/accounts/login/'" class="btn btn-secondary me-2">ログアウト</button>
        <button type="button" onclick="window.location.reload()" class="btn btn-secondary">クリア</button>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
