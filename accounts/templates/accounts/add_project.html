<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロジェクト追加</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .form-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin: 0 auto;
            max-width: 600px;
        }
        .form-title {
            color: #0dcaf0;
            margin-bottom: 25px;
            font-weight: 600;
            border-bottom: 2px solid #0dcaf0;
            padding-bottom: 10px;
        }
        .btn-info {
            background-color: #0dcaf0;
            border-color: #0dcaf0;
            color: white;
        }
        .btn-info:hover {
            background-color: #0bacce;
            border-color: #0bacce;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1 class="form-title text-center">プロジェクト追加</h1>
            
            <form method="POST" autocomplete="off">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="project_name" class="form-label">プロジェクト名</label>
                    <input type="text" class="form-control" id="project_name" name="project_name" required autocomplete="off">
                </div>
                
                <div class="d-flex justify-content-center gap-3">
                    <button type="submit" class="btn btn-info">登録</button>
                    <a href="{% url 'main' %}" class="btn btn-secondary">戻る</a>
                </div>
            </form>

            {% if messages %}
            <div class="mt-3">
                {% for message in messages %}
                <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-danger{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
